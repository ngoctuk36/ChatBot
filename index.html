<!doctype html>
<html>

<head>
	<title>Trợ lý AI - THPT Chuyên Thái Nguyên</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta charset="UTF-8">
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:ital,wght@0,100..900;1,100..900&display=swap"
		rel="stylesheet">
	<link rel="stylesheet" href="index.css">
</head>

<body>
	<header>
		<img src="./images/logo.jpg" alt="">
		<a href="/">Tin k36 - lifeAI</a>
	</header>
	<main>
		<!-- Chat input -->
		<section id="setup-container">
			<div class="setup-inner">
<img src="images/movieboss.png" alt="">
				<div class="speech-bubble-ai" id="speech-bubble-ai">
					<p id="movie-boss-text">
						Bạn cần mình hỗ trợ thông tin gì nhỉ?
					</p>
				</div>
			</div>
			<div class="setup-inner setup-input-container" id="setup-input-container">
				<textarea id="setup-textarea" placeholder="Vui lòng nhập câu hỏi ở đây."></textarea>
				<button class="send-btn" id="send-btn" aria-label="send">
					<img src="images/send-btn-icon.png" alt="send">
				</button>
			</div>
		</section>
		<!-- Chat output -->
		<section class="output-container" id="output-container">
			<div id="output-img-container" class="output-img-container"></div>
			<h1 id="output-title"></h1>
			<h2 id="output-stars"></h2>
			<p id="output-text"></p>
		</section>
	</main>
	<footer>
		&copy; 2026 THPT Chuyên Thái Nguyên
	</footer>
	<script type="module" src="index.js"></script>
</body>

</html>
